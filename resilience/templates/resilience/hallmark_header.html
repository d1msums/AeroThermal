{% load static %}
<header class="hm-masthead">
  <div class="hm-brand">
    <img src="{% static 'planner/images/sdp-logo.png' %}" alt="Sime Darby Property" width="62" height="40">
    <a class="hm-wordmark" href="{% url 'resilience:hub' project.id %}">AeroThermal<small>Township workspace</small></a>
  </div>
  <nav class="rail-nav hm-navigation" aria-label="Workspace">
    <a class="{% if audience == 'leadership' %}active{% endif %}" href="{% url 'resilience:audience' project.id 'leadership' %}"><svg aria-hidden="true"><use href="#i-grid"/></svg>Overview</a>
    <a class="{% if audience == 'engineer' %}active{% endif %}" href="{% url 'resilience:audience' project.id 'engineer' %}"><svg aria-hidden="true"><use href="#i-map"/></svg>Map &amp; planning</a>
    <a class="{% if audience == 'operations' %}active{% endif %}" href="{% url 'resilience:audience' project.id 'operations' %}"><svg aria-hidden="true"><use href="#i-pin"/></svg>Resident reports</a>
    <a class="ca-nav-link {% if audience == 'alerts' %}active{% endif %}" {% if audience == 'alerts' %}aria-current="page"{% endif %} href="{% url 'resilience:climate_alerts' project.id %}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3ZM12 9v5m0 3v1"/></svg>Climate alerts</a>
<a href="{% url 'dashboard' project.id %}">
  <svg aria-hidden="true"><use href="#i-leaf"/></svg>
  Tree simulator
</a>
  </nav>
  <div class="hm-account"><b aria-hidden="true">{{ request.user.username|slice:':1'|upper }}</b><span>{{ request.user.username }}<small>{{ membership.role|title }} access</small></span></div>
</header>
