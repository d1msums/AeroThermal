<div class="map-inbox-grid"><section class="panel map-panel"><div class="panel-heading"><div><h2>Township map</h2><p>Resident locations and lake reference</p></div><button class="small-button" id="fit-map" type="button">Fit site</button></div><div class="map-toggles"><label><input type="checkbox" id="toggle-reports" checked>App reports</label><label><input type="checkbox" id="toggle-hotspots">Sample hotspots</label><span id="map-count"></span></div><div id="visual-map" role="region" aria-label="Township map with resident report locations"></div><div class="map-footer"><div class="map-legend"><span><i class="dot flood"></i>Drainage</span><span><i class="dot wind"></i>Tree obstruction</span><span><i class="dot drought"></i>Vegetation</span><span><i class="dot heat"></i>Heat</span></div><small id="map-status">Loading map</small></div></section>
<section class="panel inbox-panel"><div class="panel-heading"><div><h2>{% if audience == 'operations' %}App report inbox{% else %}Needs attention{% endif %}</h2><p id="inbox-count"></p></div><span class="source-label">App input</span></div><div class="inbox-search"><label class="sr-only" for="report-search">Search reports</label><input id="report-search" type="search" placeholder="Find a report or location"></div><div id="report-list" class="report-list"></div><p class="list-note" id="list-note"></p></section></div>
<dialog id="report-inspector" class="inspector"><div class="inspector-top"><span id="inspect-reference"></span><button class="icon-button" id="close-inspector" type="button" aria-label="Close report"><svg><use href="#i-x"/></svg></button></div><div class="attachment-wrap"><img id="inspect-image" alt="Report attachment"><span id="inspect-image-label"></span></div><div class="inspector-body"><div class="inspector-tags"><span id="inspect-status" class="status"></span><span id="inspect-source" class="data-tag"></span></div><h2 id="inspect-title"></h2><p id="inspect-description"></p><dl class="facts"><div><dt>Location</dt><dd id="inspect-location"></dd></div><div><dt>Reported</dt><dd id="inspect-time"></dd></div><div><dt>Assigned</dt><dd id="inspect-assigned"></dd></div></dl><div class="inspection-actions"><button id="locate-report" class="small-button" type="button">Locate on map</button><a id="inspect-open" class="button">Open work item <svg><use href="#i-arrow"/></svg></a></div></div></dialog>
